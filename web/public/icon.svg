<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- vid.kold.gold: el sello de Kold Gold (aro de acero, aro cobre y globo) con el play al centro. -->
  <defs>
    <radialGradient id="fondo" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#20263a" />
      <stop offset="100%" stop-color="#080a0f" />
    </radialGradient>
    <linearGradient id="cobre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd3a1" />
      <stop offset="45%" stop-color="#d69a5c" />
      <stop offset="100%" stop-color="#7d4a22" />
    </linearGradient>
    <linearGradient id="acero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f7f9" />
      <stop offset="50%" stop-color="#a9b0bd" />
      <stop offset="100%" stop-color="#454c5c" />
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="250" fill="url(#acero)" />
  <circle cx="256" cy="256" r="232" fill="url(#fondo)" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#cobre)" stroke-width="11" />
  <!-- El globo, apenas: paralelos y un meridiano en cobre tenue. -->
  <g fill="none" stroke="#d69a5c" stroke-opacity="0.22" stroke-width="4">
    <ellipse cx="256" cy="256" rx="176" ry="66" />
    <ellipse cx="256" cy="256" rx="84" ry="176" />
    <ellipse cx="256" cy="186" rx="150" ry="40" />
    <ellipse cx="256" cy="326" rx="150" ry="40" />
  </g>
  <!-- El play, en cobre con filo de acero, un poco a la derecha para que se vea centrado. -->
  <path d="M 214 160 Q 204 154 204 166 L 204 346 Q 204 358 214 352 L 360 264 Q 370 256 360 248 Z" fill="url(#cobre)" stroke="url(#acero)" stroke-width="10" stroke-linejoin="round" />
</svg>

<!doctype html>
<!--
  La guía de lo nuevo de la 1.1.5: sale una vez al abrir v!d después de instalarla encima (web/src/Novedades.tsx, en un
  iframe), y también se abre sola en un navegador. Una página suelta, sin dependencias: el logo (web/public/icon.svg) va
  adentro, en #cara. Hecha de la guía 0.4.0 de Sloth, sin la escena de «Cambiar de disco» (v!d no la trae). Seis escenas; cada una tiene su guion en `guiones`, y «Siguiente», las flechas o deslizar pasan
  de una a otra. Con ?escena=N abre directo en una.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v!d 1.1.5</title>
<style>
  /* Paleta de v!d (web/src/styles.css) y la plata del logo. */
  :root {
    --bg: #0b0d12; --panel: #12151c; --panel-2: #1b1f29; --line: #2a303d; --text: #e6e9ef; --muted: #8f97a8;
    --amber: #d69a5c; --amber-2: #efb57a; --sobre-ambar: #1a1006; --ok: #8fc177; --bad: #e06c55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; overflow: hidden; color: var(--text); font-family: Inter, 'Segoe UI', system-ui, sans-serif; }
  .escenario { position: relative; width: min(100vw, 100vh); max-width: 1080px; aspect-ratio: 1; user-select: none; -webkit-user-select: none; }
  .escenario > svg, .escenario > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  canvas { pointer-events: none; }
  .controles { position: absolute; left: 8.33%; right: 8.33%; bottom: 3.2%; display: flex; align-items: center; gap: 12px; font-size: clamp(12px, 1.85vmin, 20px); }
  .controles button { font: inherit; font-weight: 700; border-radius: 12px; padding: .8em 1.25em; cursor: pointer; border: 2px solid var(--line); background: var(--panel); color: var(--text); display: inline-flex; align-items: center; gap: .55em; transition: transform .12s, background-color .2s, border-color .2s, opacity .3s; }
  .controles button:hover { border-color: var(--muted); }
  .controles button:active { transform: scale(.95); }
  .controles button:focus-visible { outline: 3px solid var(--amber-2); outline-offset: 3px; }
  .controles svg { width: 1.25em; height: 1.25em; }
  #siguiente { margin-left: auto; background: var(--amber); border-color: var(--amber); color: var(--sobre-ambar); }
  #siguiente:hover { background: var(--amber-2); border-color: var(--amber-2); }
  #anterior.oculto { opacity: 0; pointer-events: none; }
  #cuenta { flex: 1; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }

  .a { transform-box: fill-box; transform-origin: center; }
  .izq { transform-box: fill-box; transform-origin: 0 50%; }
  .abajo { transform-box: fill-box; transform-origin: 50% 100%; }
  .arriba { transform-box: fill-box; transform-origin: 50% 0; }
  .escena { display: none; }
  .escena.visible { display: inline; }
  .globo { cursor: pointer; }
  #rayos { transition: opacity .9s; }
  #brillo stop { transition: stop-color 1s; }
  .num { font-variant-numeric: tabular-nums; }

  /* Lo que se mueve siempre: el sello brinca, el gorro se menea, el espantasuegras sopla, los rayos giran. */
  .gira { animation: girar 40s linear infinite; }
  .brinca { animation: brinco 1.1s cubic-bezier(.5,0,.5,1) infinite; }
  .sombra { animation: sombra 1.1s cubic-bezier(.5,0,.5,1) infinite; }
  .menea { animation: menear 1.1s ease-in-out infinite; }
  .sopla { animation: soplar 2.2s cubic-bezier(.3,1.3,.5,1) infinite; }
  .mece { animation: mecer 2.4s ease-in-out infinite alternate; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @keyframes brinco {
    0%, 100% { transform: translateY(0) scale(1.07, .93); }
    15% { transform: translateY(0) scale(.96, 1.05); }
    50% { transform: translateY(-60px) scale(1, 1); }
    85% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes sombra { 0%, 100% { transform: scale(1); opacity: .55; } 50% { transform: scale(.68); opacity: .22; } }
  @keyframes menear { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
  @keyframes soplar { 0%, 100% { transform: scaleX(.1); } 28%, 60% { transform: scaleX(1); } 76% { transform: scaleX(.1); } }
  @keyframes mecer { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  @media (prefers-reduced-motion: reduce) { .gira, .brinca, .sombra, .menea, .sopla, .mece { animation: none; } }
</style>
</head>

    oculto(en(e, '.aviso')); oculto(en(e, '.sigue')); oculto(en(e, '.cursor'));
    todos(e, '.tecla2').forEach((t) => A(t, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(0)' }], { duration: 1 }));
    todos(e, '.tecla').forEach((t, k) => A(t, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 520, delay: 500 + k * 520, easing: 'linear' }));
    A(uso, [{ strokeDashoffset: L * 0.36, stroke: C.amber }, { stroke: C.amber, offset: 0.6 }, { strokeDashoffset: 0, stroke: C.bad }], { duration: 1900, delay: 500, easing: 'cubic-bezier(.5,0,.85,.6)' });
    await espera(500); if (!vivo()) return;
    await tween(1900, (t) => (pct.textContent = `${Math.round(64 + t * 36)} %`), vivo, (t) => t * t);
    if (!vivo()) return;
    en(e, '.anillo').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.1)' }, { transform: 'scale(1)' }], { duration: 420, easing: 'ease-out' });
    sacudir(en(e, '.ventana'), 9);
    A(en(e, '.aviso'), [{ opacity: 0, transform: 'translateY(60px) scale(.94)' }, { opacity: 1, transform: 'none' }], { duration: 650, easing: REBOTE });
    await espera(1000); if (!vivo()) return;
    const cur = en(e, '.cursor');
    await mover(cur, [960, 650], [700, 560], 800); if (!vivo()) return;
    clic(e, cur, 700, 560);
    await espera(250); if (!vivo()) return;
    A(en(e, '.aviso'), [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(40px) scale(.96)' }], { duration: 380, easing: 'ease-in' });
    A(cur, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, delay: 200 });
    const av = en(e, '.avatar');
    av.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: 180, easing: 'ease-in' }).onfinish = () => {
      if (!vivo()) return;
      ac.setAttribute('fill', C.ok); at.textContent = '2'; ct.textContent = 'Cuenta 2';
      av.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1.15)' }, { transform: 'scaleX(1)' }], { duration: 380, easing: 'ease-out' });
      const [x, y] = aLienzo(av); estallido(x, y, C.ok, 36, 6);
    };
    A(uso, [{ strokeDashoffset: 0, stroke: C.bad }, { strokeDashoffset: L * 0.92, stroke: C.ok }], { duration: 900, delay: 300 });
    tween(900, (t) => (pct.textContent = `${Math.round(100 - t * 92)} %`), vivo);
    await espera(500); if (!vivo()) return;
    todos(e, '.tecla2').forEach((t, k) => A(t, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 420, delay: k * 380, easing: 'linear' }));
    aparece(en(e, '.sigue'), { delay: 1250 });
  },
  // 4 · Google Flow: los clips se revelan
  async (e, vivo) => {
    textos(e);
    salta(en(e, '.insignia'), { delay: 80 });
    A(en(e, '.tira'), [{ opacity: 0, transform: 'translateX(120px)' }, { opacity: 1, transform: 'none' }], { duration: 700, delay: 150 });
    const est = en(e, '.estado'), cred = en(e, '.cred');
    est.textContent = 'Generando clips…'; est.setAttribute('fill', C.muted); cred.textContent = '24';
    en(e, '.r720').setAttribute('fill', '#1a1006'); en(e, '.r360').setAttribute('fill', C.muted);
    todos(e, '.tag').forEach((t) => (t.textContent = '720p'));
    oculto(en(e, '.cursor'));
    // Lo que se mueve dentro de cada clip
    A(en(e, '.sol'), [{ transform: 'translateY(30px)' }, { transform: 'translateY(-6px)' }], { duration: 2600, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
    A(en(e, '.aves'), [{ transform: 'translateX(-60px)' }, { transform: 'translateX(220px)' }], { duration: 5000, iterations: Infinity, easing: 'linear' });
    A(en(e, '.columpio'), [{ transform: 'rotate(-10deg)' }, { transform: 'rotate(10deg)' }], { duration: 1300, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
    A(en(e, '.coche'), [{ transform: 'translateX(0)' }, { transform: 'translateX(320px)' }], { duration: 2800, iterations: Infinity, easing: 'linear' });
    todos(e, '.luz-v').forEach((l) => A(l, [{ opacity: 0.15 }, { opacity: 0.9 }], { duration: azar(500, 1400), delay: azar(0, 1500), iterations: Infinity, direction: 'alternate', easing: 'steps(1)' }));
    const frames = todos(e, '.fr');
    frames.forEach((f, k) => {
      const base = 700 + k * 650;
      todos(f, '.px').forEach((p) => A(p, [{ opacity: 1 }, { opacity: 0 }], { duration: 260, delay: base + azar(0, 750) }));
      A(en(f, '.escaneo'), [{ opacity: 1, transform: 'translateX(0)' }, { opacity: 1, transform: 'translateX(300px)' }], { duration: 900, delay: base, easing: 'ease-in-out' });
      A(f, [{ transform: 'scale(1)' }, { transform: 'scale(1)', offset: 0.85 }, { transform: 'scale(1.06)', offset: 0.93 }, { transform: 'scale(1)' }], { duration: base + 1100, fill: 'none' });
    });
    await espera(700 + 2 * 650 + 1000); if (!vivo()) return;
    est.textContent = '3 clips listos'; est.setAttribute('fill', C.ok);
    A(est, [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 400 });
    confeti(540, 400, 50, -90, 180, [5, 12]);
    await espera(700); if (!vivo()) return;
    const cur = en(e, '.cursor');
    await mover(cur, [900, 640], [457, 580], 750); if (!vivo()) return;
    clic(e, cur, 457, 580);
    A(en(e, '.selector'), [{ transform: 'translateX(0)' }, { transform: 'translateX(210px)' }], { duration: 550, easing: REBOTE });
    en(e, '.r720').setAttribute('fill', C.muted); en(e, '.r360').setAttribute('fill', '#1a1006');
    todos(e, '.tag').forEach((t) => (t.textContent = '360p'));
    todos(e, '.px').forEach((p) => A(p, [{ opacity: 0 }, { opacity: 0.55 }, { opacity: 0 }], { duration: 500, delay: azar(0, 250) }));
    salta(en(e, '.cred-w'), { duration: 500 });
    tween(700, (t) => (cred.textContent = String(Math.round(24 - t * 16))), vivo);
    A(cur, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, delay: 700 });
    await espera(650); if (!vivo()) return;
    const [x, y] = aLienzo(cred); confeti(x, y, 40, -100, 120, [5, 11]);
  },
  // 5 · A crear
  async (e, vivo) => {
    sloth(e); globos(e);
    const letras = todos(e, '.letra');
    letras.forEach((l, k) => A(l, [{ opacity: 0, transform: `translateY(-260px) rotate(${azar(-60, 60)}deg) scale(.5)` }, { opacity: 1, transform: 'none' }], { duration: 900, delay: 400 + k * 70, easing: REBOTE }));
    letras.forEach((l, k) => A(l, [{ transform: 'translateY(0)' }, { transform: 'translateY(-20px)' }], { duration: 560, delay: 1700 + k * 90, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out', fill: 'none' }));
    todos(e, '.linea').forEach((l, k) => aparece(l, { delay: 1100 + k * 150 }));
    await espera(1000); if (!vivo()) return;
    for (let i = 0; i < 6 && vivo(); i++) { cohete(azar(160, 920), azar(150, 360), COLORES[i % 4]); await espera(160); }
    lluvia(160);
    fuegos(vivo, [800, 1500]);
  },
];

/* ---------- Ir de una a otra ---------- */
let actual = -1, token = 0, pulso = null;
const cab = document.getElementById('cabecera');
const sigBtn = document.getElementById('siguiente'), antBtn = document.getElementById('anterior');
const sigTxt = document.getElementById('sig-texto'), sigIco = document.getElementById('sig-icono'), cuenta = document.getElementById('cuenta');
const brilloStops = [...document.querySelectorAll('#brillo stop')];
const TONO = [C.amber, C.amber, C.ok, C.bad, C.ok, C.amber];

function limpiar(e) {
  e.getAnimations({ subtree: true }).forEach((a) => { if (!(a instanceof CSSAnimation)) a.cancel(); });
  todos(e, '.temporal').forEach((n) => n.remove());
}
function pulsar() {
  if (quieto) return;
  pulso = sigBtn.animate([{ boxShadow: '0 0 0 0 rgba(214, 154, 92, .6)' }, { boxShadow: '0 0 0 16px rgba(214, 154, 92, 0)' }], { duration: 1400, iterations: Infinity });
}
function interfaz(i, antes) {
  antBtn.classList.toggle('oculto', i === 0);
  sigTxt.textContent = i === 0 ? 'Ver lo nuevo' : i === 4 ? 'Terminar' : i === 5 ? (enSloth ? 'Empezar a crear' : 'Ver otra vez') : 'Siguiente';
  sigIco.setAttribute('href', i === 5 && !enSloth ? '#i-reabrir' : '#i-flecha');
  cuenta.textContent = i >= 1 && i <= 4 ? `${i} de 4` : '';
  brilloStops.forEach((s) => (s.style.stopColor = TONO[i]));
  document.getElementById('rayos').style.opacity = i === 0 || i === 5 ? 1 : 0.3;
  const dentro = (k) => k >= 1 && k <= 4;
  if (dentro(i) && !dentro(antes)) A(cab, [{ opacity: 0, transform: 'translateY(-40px)' }, { opacity: 1, transform: 'none' }], { duration: 600, delay: 150 });
  if (!dentro(i) && dentro(antes)) A(cab, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-40px)' }], { duration: 350 });
  todos(cab, '.barra-llena').forEach((b, k) => {
    b.getAnimations().forEach((a) => a.cancel());
    if (k === i - 1) A(b, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 800, delay: 200 });
    else b.style.transform = `scaleX(${k < i - 1 ? 1 : 0})`;
  });
}
function ir(i, dir = 1) {
  if (i < 0 || i >= N || i === actual) return;
  if (pulso) { pulso.cancel(); pulso = null; }
  const antes = actual, prev = antes >= 0 ? escenas[antes] : null;
  const t = ++token, vivo = () => t === token;
  if (prev) {
    const s = A(prev, [{ opacity: 1, transform: 'translateX(0)' }, { opacity: 0, transform: `translateX(${-dir * 180}px)` }], { duration: 380, easing: 'cubic-bezier(.5,0,.8,.3)' });
    s.finished.then(() => { if (escenas[actual] !== prev) { prev.classList.remove('visible'); limpiar(prev); } }, () => {});
  }
  const e = escenas[i];
  limpiar(e); e.classList.add('visible');
  A(e, [{ opacity: 0, transform: `translateX(${dir * 200}px)` }, { opacity: 1, transform: 'translateX(0)' }], { duration: 750, delay: prev ? 220 : 0, easing: 'cubic-bezier(.2,1.1,.3,1)' });
  actual = i;
  interfaz(i, antes);
  guiones[i](e, vivo);
}
const siguiente = () => (actual === N - 1 ? (enSloth ? cerrarGuia() : ir(0, 1)) : ir(actual + 1, 1));
if (enSloth) document.querySelector('.despedida').textContent = 'Gracias por crear con v!d.';
const anterior = () => ir(actual - 1, -1);
sigBtn.addEventListener('click', siguiente);
antBtn.addEventListener('click', anterior);
addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowRight' || ev.key === 'PageDown') { ev.preventDefault(); siguiente(); }
  if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { ev.preventDefault(); anterior(); }
  if (ev.key === 'Escape' && enSloth) cerrarGuia();
});
// Deslizar con el dedo
let x0 = null;
const esc_ = document.getElementById('escenario');
esc_.addEventListener('pointerdown', (ev) => (x0 = ev.clientX));
esc_.addEventListener('pointerup', (ev) => { if (x0 === null) return; const d = ev.clientX - x0; x0 = null; if (Math.abs(d) > 60) d < 0 ? siguiente() : anterior(); });

document.fonts.ready.then(() => {
  construir();
  escenas.forEach((e) => e.classList.add('visible'));
  todos(svg, '.partir-letras').forEach((t) => partir(t, 'letra'));
  todos(svg, '.partir-palabras').forEach((t) => partir(t, 'palabra'));
  escenas.forEach((e) => e.classList.remove('visible'));
  const pedida = +new URLSearchParams(location.search).get('escena') || 0;
  ir(Math.min(Math.max(pedida, 0), N - 1));
});
